# Конфигурация Spark по умолчанию для нашего Hadoop/YARN-кластера.
#
# Этот файл копируется в /opt/spark/conf/ внутри образа и подхватывается
# `spark-submit` автоматически — флаги `--master yarn` и т.п. можно не
# писать, но в скриптах запуска лаб они продублированы для наглядности.

spark.master                       yarn
spark.submit.deployMode            client

# Где Spark ищет настройки YARN/HDFS.
spark.yarn.appMasterEnv.HADOOP_CONF_DIR   /opt/hadoop/etc/hadoop
spark.executorEnv.HADOOP_CONF_DIR         /opt/hadoop/etc/hadoop

# Учебные лимиты на размер процессов. YARN на воркере = 4 ГБ / 2 vCPU,
# поэтому AM/executor берём заведомо меньшие значения, чтобы они помещались.
spark.driver.memory                512m
spark.driver.cores                 1
spark.executor.memory              768m
spark.executor.cores               1
spark.yarn.am.memory               512m
spark.yarn.am.cores                1

# Логи приложений отдаём на JobHistory/Spark-история через стандартный
# event log (включается флагом `spark.eventLog.enabled=true`).  Файлы
# складываем в HDFS, чтобы их видели все ноды кластера.
spark.eventLog.enabled             true
spark.eventLog.dir                 hdfs://namenode:9000/spark-logs
spark.history.fs.logDirectory      hdfs://namenode:9000/spark-logs

# В контейнерах нет доступа к UI извне напрямую, поэтому достаточно
# UI-порта по умолчанию (4040). Внешне результаты смотрим через
# `yarn logs -applicationId <id>`.
spark.ui.showConsoleProgress       true

# === Multi-host networking ===
# В нашем сетапе кластер живёт на 3 машинах в LAN, между контейнерами
# нет общей Docker-сети — связь только через опубликованные порты на
# LAN-IP мастера/воркеров. Поэтому:
#  * драйвер биндимся на 0.0.0.0 (внутри контейнера IP контейнера != LAN-IP),
#  * порты драйвера и BlockManager фиксируем, чтобы их можно было
#    публиковать в docker-compose (см. start.ps1: 32100-32107).
spark.driver.bindAddress           0.0.0.0
spark.driver.port                  32100
spark.blockManager.port            32104
spark.port.maxRetries              3

# spark.driver.host определяется автоматически из hostname контейнера,
# в котором живёт driver:
#  * cluster-mode → AM-контейнер на воркере, hostname = worker1/workerN;
#    /etc/hosts после fix_hostname_for_lan содержит только LAN-IP воркера,
#    поэтому Java резолвит hostname → LAN-IP.
#  * client-mode  → resourcemanager-контейнер на мастере; entrypoint.sh
#    у resourcemanager тоже зовёт fix_hostname_for_lan, плюс env
#    SPARK_LOCAL_HOSTNAME=<MASTER_LAN_IP> выставляется в start.ps1,
#    чтобы Spark в любом случае рекламировал LAN-IP, а не bridge-IP.
