# Конфигурация Spark по умолчанию для нашего Hadoop/YARN-кластера.
#
# Этот файл копируется в /opt/spark/conf/ внутри образа и подхватывается
# `spark-submit` автоматически — флаги `--master yarn` и т.п. можно не
# писать, но в скриптах запуска лаб они продублированы для наглядности.

spark.master                       yarn
spark.submit.deployMode            client

# Где Spark ищет настройки YARN/HDFS.
spark.yarn.appMasterEnv.HADOOP_CONF_DIR   /opt/hadoop/etc/hadoop
spark.executorEnv.HADOOP_CONF_DIR         /opt/hadoop/etc/hadoop

# Учебные лимиты на размер процессов. YARN на воркере = 4 ГБ / 2 vCPU,
# поэтому AM/executor берём заведомо меньшие значения, чтобы они помещались.
spark.driver.memory                512m
spark.driver.cores                 1
spark.executor.memory              768m
spark.executor.cores               1
spark.yarn.am.memory               512m
spark.yarn.am.cores                1

# Логи приложений отдаём на JobHistory/Spark-история через стандартный
# event log (включается флагом `spark.eventLog.enabled=true`).  Файлы
# складываем в HDFS, чтобы их видели все ноды кластера.
spark.eventLog.enabled             true
spark.eventLog.dir                 hdfs://namenode:9000/spark-logs
spark.history.fs.logDirectory      hdfs://namenode:9000/spark-logs

# В контейнерах нет доступа к UI извне напрямую, поэтому достаточно
# UI-порта по умолчанию (4040). Внешне результаты смотрим через
# `yarn logs -applicationId <id>`.
spark.ui.showConsoleProgress       true

# ─── Сетевые порты для multi-host Docker ─────────────────────────────────
#
# Spark по умолчанию использует СЛУЧАЙНЫЕ TCP-порты для driver↔executor RPC
# и block-manager'а. В одном Docker-хосте это работает (контейнеры видят
# друг друга по bridge-сети), но в нашем multi-laptop кластере общение
# идёт через LAN + проброшенные `ports:` в docker-compose: случайные порты
# наружу не выставлены, и Spark-приложения зависают на
# `Initial job has not accepted any resources` или валятся по таймауту RPC.
#
# Поэтому фиксируем порты ниже, а в `start.ps1` / `setup-cluster.{sh,ps1}`
# они явно прокинуты у `resourcemanager` (driver/UI) и `nodemanager`
# (executor block-manager).  MR на это не влияет — MR-AM ходит через свой
# собственный umbilical (32000-32001), который уже был опубликован.

# Driver биндится на 0.0.0.0 внутри контейнера, чтобы Docker мог пробросить
# наружу published-порт (без этого Spark биндится только на eth0 контейнера
# и хост-порт смотрит «в пустоту»).
spark.driver.bindAddress           0.0.0.0

# Driver RPC + block manager.  Должны совпадать с published-портами
# resourcemanager-контейнера (где обычно запускают spark-submit).
spark.driver.port                  7077
spark.driver.blockManager.port     7078

# Executor block manager.  Должен совпадать с published-портами worker-
# контейнеров.  Под `port.maxRetries` ниже выделен небольшой запас на
# случай, если несколько executor'ов попадут на один NodeManager.
spark.blockManager.port            7079

# Если фиксированный порт занят (например, 2 executor'а на одном
# NodeManager), Spark попробует +1, +2, ... до 5 раз.  Соответственно
# нужно опубликовать `7079-7084` на воркерах.
spark.port.maxRetries              5
