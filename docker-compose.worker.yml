# Compose-файл для ВОРКЕР-ноутбука.
#
# Поднимает: DataNode + NodeManager.
#
# На каждом воркере в .env должен быть выставлен NODE_NAME=worker1 либо
# NODE_NAME=worker2 (имя должно совпадать со значением в config/workers
# и в extra_hosts мастера).
#
# Запуск:
#   docker compose -f docker-compose.worker.yml up -d --build

x-extra-hosts: &extra_hosts
  - "namenode:${MASTER_IP:?MASTER_IP должен быть задан в .env}"
  - "secondarynamenode:${MASTER_IP}"
  - "resourcemanager:${MASTER_IP}"
  - "historyserver:${MASTER_IP}"
  - "worker1:${WORKER1_IP:?WORKER1_IP должен быть задан в .env}"
  - "worker2:${WORKER2_IP:?WORKER2_IP должен быть задан в .env}"

x-image: &image clustrer-hadoop:${HADOOP_VERSION:-3.3.6}

services:
  datanode:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HADOOP_VERSION: ${HADOOP_VERSION:-3.3.6}
    image: *image
    container_name: datanode
    hostname: ${NODE_NAME:?NODE_NAME (worker1|worker2) должен быть задан в .env}
    environment:
      HADOOP_ROLE: datanode
      NODE_NAME: ${NODE_NAME}
      DN_HTTP_PORT: ${DN_HTTP_PORT:-9864}
      DN_XFER_PORT: ${DN_XFER_PORT:-9866}
      DN_IPC_PORT:  ${DN_IPC_PORT:-9867}
    ports:
      # На worker1 — дефолт 9864/9866/9867; на worker2 в .env пропиши
      # DN_HTTP_PORT=9874, DN_XFER_PORT=9876, DN_IPC_PORT=9877 (и т.д.
      # для workerN: 9866+(N-1)*10). Разные xferPort нужны, чтобы NN
      # не путал обоих DN под одним (source_ip, port) после NAT мастер-bridge.
      # Явные порты вместо range'а — обход бага Docker Desktop на Windows,
      # который криво форвардит "9864-9890:9864-9890".
      - "${DN_HTTP_PORT:-9864}:${DN_HTTP_PORT:-9864}"
      - "${DN_XFER_PORT:-9866}:${DN_XFER_PORT:-9866}"
      - "${DN_IPC_PORT:-9867}:${DN_IPC_PORT:-9867}"
    volumes:
      - datanode_data:/data/hdfs/datanode
      - hadoop_logs:/opt/hadoop/logs
    extra_hosts: *extra_hosts
    restart: unless-stopped

  nodemanager:
    image: *image
    container_name: nodemanager
    hostname: ${NODE_NAME}
    depends_on:
      - datanode
    environment:
      HADOOP_ROLE: nodemanager
      NODE_NAME: ${NODE_NAME}
    ports:
      - "8040:8040"   # NodeManager localizer
      - "8041:8041"   # NodeManager RPC
      - "8042:8042"   # NodeManager Web UI
      - "13562:13562" # MapReduce shuffle
      - "32000-32100:32000-32100"  # YARN AM port range
    volumes:
      - hadoop_logs:/opt/hadoop/logs
    extra_hosts: *extra_hosts
    restart: unless-stopped

volumes:
  datanode_data:
  hadoop_logs:
